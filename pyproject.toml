[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-sim"
version = "0.1.0"
description = "2D/3D acoustic simulation and passive acoustic engagement"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]
dev = ["pytest", "build"]
ml = ["torch"]
mpi = ["mpi4py"]

[project.scripts]
acoustic-sim = "acoustic_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "gpu: needs CuPy and a GPU (the GPU kernels and the CPU against GPU parity tests); run by .github/workflows/gpu-tests.yml",
]
