name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # The whole test suite on the CPU (the GPU tests skip without CuPy; .github/workflows/gpu-tests.yml runs them).
    # About 6 minutes on two cores, so one job per Python version.
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest tests -q -rs -p no:cacheprovider --junitxml=report.xml
      - name: Count the skipped tests
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("report.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          print(f"tests {s.get('tests')}, skipped {s.get('skipped')}, failures {s.get('failures')}, errors {s.get('errors')}")
          PY
