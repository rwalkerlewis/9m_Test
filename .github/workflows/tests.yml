name: Basic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run basic CPU tests
        run: >-
          python -m pytest -q
          tests/test_package_layout.py
          tests/test_contract.py
          tests/harbor/test_dispersion.py
          tests/harbor/test_characteristics.py
          tests/harbor/test_ci_end_to_end.py
          tests/test_fdtd_3d.py::test_cfl
          tests/test_fdtd_3d.py::test_propagation
